<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="复制设备信息并发送给工作人员。" />
    <title>复制设备信息</title>
    <link rel="icon" href="./diagnostic-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="copy-area" aria-labelledby="pageTitle">
        <img class="copy-area__mark" src="./diagnostic-mark.svg" alt="" width="72" height="72" />
        <h1 id="pageTitle">复制设备信息</h1>
        <p class="copy-area__intro">点击下方按钮，然后把复制的内容发给工作人员。</p>

        <button class="copy-button" id="copyButton" type="button" disabled>
          <span id="copyButtonLabel">复制完整报告</span>
        </button>

        <p class="status" id="statusText" role="status" aria-live="polite">正在准备设备信息</p>
        <p class="privacy">不会包含账号、密码或浏览记录</p>
      </section>
    </main>

    <noscript>
      <div class="noscript-message">请开启浏览器的 JavaScript 后重新打开此页面。</div>
    </noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
